[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflectivity-injection-timing"
version = "0.1.0"
description = "Segment and align molecular reflectivity traces by injection cycle."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "chardet>=5.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "PyQt5>=5.15.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rita = "reflectivity_injection_timing.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
